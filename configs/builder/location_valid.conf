# valid location lines; expected debug output: path, exact match
server {
    listen 8080;

    location / { }              # "/"      exact: no
    location /a { }             # "/a"     exact: no
    location = /a { }           # "/a"     exact: yes  (not a duplicate of /a)
    location /b/ { }            # "/b"     exact: no
    location /c// { }           # "/c"     exact: no
    location /d/e/ { }          # "/d/e"   exact: no
    location =/f { }            # "/f"     exact: yes
    location = /g/ { }          # "/g"     exact: yes
    location =/h// { }          # "/h"     exact: yes
    location = // { }           # "/"      exact: yes  (not a duplicate of /)
    location "/i" { }           # "/i"     exact: no   (quotes are removed by the tokenizer)
    location /j.k { }           # "/j.k"   exact: no
}
