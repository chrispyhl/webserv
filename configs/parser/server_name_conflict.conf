# same server name on the same address in two servers: nginx warns and ignores the later claim
# this config is valid (warnings don't stop the program), so parsing must succeed
# expected (one line per conflict, in this order):
#   conflicting server name "a.localhost" on 127.0.0.1:8080, ignored
#   conflicting server name "b.localhost" on 127.0.0.1:8080, ignored
#   conflicting server name "c.localhost" on 0.0.0.0:9090, ignored
# expected NOT to warn: same name on another port, duplicates inside one server,
# names that only partly overlap

# 1: the reference server
server {
    listen      127.0.0.1:8080;
    server_name a.localhost b.localhost;
}

# 2: claims a.localhost on the same address -> warning for "a.localhost"
#    also claims a.localhost twice within itself -> no extra warning for that
server {
    listen      127.0.0.1:8080;
    server_name a.localhost a.localhost x.localhost;
}

# 3: same name, different port -> no warning
server {
    listen      8081;
    server_name a.localhost;
}

# 4: B.LOCALHOST is the same name as b.localhost (names are case-insensitive) -> warning for "b.localhost"
server {
    listen      127.0.0.1:8080;
    server_name B.LOCALHOST;
}

# 5 and 6: two listen addresses each, overlapping only on 9090 -> warning only for that address
server {
    listen      9090;
    listen      127.0.0.1:7070;
    server_name c.localhost;
}
server {
    listen      9090;
    listen      127.0.0.1:7071;
    server_name c.localhost;
}

# 7: a name that merely starts like another one is no conflict
server {
    listen      127.0.0.1:8080;
    server_name a.localhost.example;
}
