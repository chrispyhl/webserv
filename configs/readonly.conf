# webserv dummy config
# nginx syntax:
## blocks in {}
## directives end with ;
## comment lines start with #

# SERVER 1: main site on port 8080
# default server for that port
server {
    listen               127.0.0.1:8080;
    server_name          localhost www.localhost;

    root                 ./www/main;
    index                index.html index.htm;
    client_max_body_size 1M;

    error_page 404       /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    # inherits root, index and body size from server block
    location / {
        allow_methods GET;
        autoindex     off;
    }

    # directory listing enabled
    # overrides nothing else
    location /files {
        allow_methods GET;
        autoindex     on;
    }

    # uploads: POST and DELETE allowed, larger body limit than the server
    location /upload {
        allow_methods        GET POST DELETE;
        upload_dir           ./www/main/uploads;
        client_max_body_size 10M;
    }

    # location with own root
    location /images {
        root          ./www/static;
        allow_methods GET;
    }

    # redirect: no root needed, request never touches the filesystem
    location /old-page {
        return 301 /new-page;
    }

    # CGI by file extension
    location /cgi-bin {
        root          ./www/cgi;
        allow_methods GET POST;
        cgi           .py  /usr/bin/python3;
        cgi           .php /usr/bin/php-cgi;
    }
}

# SERVER 2: same host:port, different name (virtual host)
# selected only when the host header = "api.localhost"
server {
    listen      127.0.0.1:8080;
    server_name api.localhost;

    root        ./www/api;
    index       index.json;

    location / {
        allow_methods GET POST;
    }
}

# SERVER 3: different port, minimal block
# No error_page, no body size = built-in defaults must apply
server {
    listen 8081;
    root   ./www/minimal;

    location / {
        allow_methods GET;
        index         home.html;
    }
}
