# line numbers: every token gets the line where it STARTS (line given in brackets)
# expected at the end: END [21]

# directive spread over several lines
# expected: WORD server_name [6], WORD localhost [7], WORD www.localhost [8], SEMICOLON [9]
server_name
    localhost
    www.localhost
;

# word followed by trailing spaces, then the newline
# expected: WORD root [13], WORD ./www [13], SEMICOLON [14]
root ./www   
;

# multi-line quoted string: the WORD keeps its start line, later tokens are not shifted
# expected: WORD root [18], WORD [first<newline>second] [18], SEMICOLON [19], WORD index [20], WORD x [20], SEMICOLON [20]
root "first
second";
index x;
