# reading the config file
#
# case 1: file cannot be opened -> run: ./webserv configs/unopenable.conf
# expected: webserv: configs/unopenable.conf: unable to open config file
#
# case 2: path is a directory -> run: ./webserv configs/tokenizer
# expected: webserv: configs/tokenizer: failed to read config file
#
# case 3: this file. lines 12-14 end with CRLF, and there is no newline at file end
# the content must be read byte for byte (\r is whitespace for the tokenizer)
# expected: WORD root [12], WORD ./www [12], SEMICOLON [13], WORD index [14], WORD x [14], SEMICOLON [14], WORD last [15], END [15]
root ./www
;
index x;
last