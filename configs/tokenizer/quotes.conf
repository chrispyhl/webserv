# valid quoted strings; the quotes themselves are not part of the WORD text

# double and single quotes
# expected: WORD root, WORD [my dir], SEMICOLON
root "my dir";
# expected: WORD root, WORD [my dir], SEMICOLON
root 'my dir';

# special characters inside quotes are plain text
# expected: WORD root, WORD [a { b } ; # c], SEMICOLON
root "a { b } ; # c";

# a quote in the middle of a word is a normal character
# expected: WORD root, WORD [ab"cd"], SEMICOLON
root ab"cd";

# empty string
# expected: WORD root, WORD [] (empty text), SEMICOLON
root "";

# after a closing quote, whitespace, ";" and "{" may follow
# expected: WORD location, WORD [/x], LBRACE, RBRACE
location "/x"{}
