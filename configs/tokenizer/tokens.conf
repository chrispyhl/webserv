# basic tokens: whitespace, delimiters, comments
# each case: expected tokens in the comment above it

# spaces and tabs separate words
# expected: WORD root, WORD ./www, SEMICOLON
root	  ./www ;

# "{" and ";" glued to words
# expected: WORD server, LBRACE, WORD listen, WORD 8080, SEMICOLON, RBRACE
server{listen 8080;}

	# indented comment: no tokens from this line
# expected: WORD index, WORD a.html, SEMICOLON (no token from the trailing comment)
index a.html; # trailing comment

# "#" in the middle of a word is a normal character
# expected: WORD root, WORD [a#b], SEMICOLON
root a#b;
