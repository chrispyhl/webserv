# backslash handling test
# every "expected" value was verified against nginx (nginx:latest, via "return 200 <value>")
# each case: WORD caseNN, WORD <value>, SEMICOLON
# notation in the comments: [..] = exact WORD text, <newline> = newline char, <TAB> = tab char

# --- unquoted ---

# escaped ';' does not end the word; backslash stays in the text
# expected: [a\;b]
case01 a\;b;

# escape at the start of a word; backslash stays
# expected: [\;b]
case02 \;b;

# escaped space does not end the word; backslash stays
# expected: [a\ b]
case03 a\ b;

# escaped backslash: one backslash removed
# expected: [a\b]
case04 a\\b;

# escaped quote mid-word: backslash removed
# expected: [a"b]
case05 a\"b;

# escaped '#' at word start: no comment, backslash stays
# expected: [\#notacomment]
case06 \#notacomment;

# escaped '}' mid-word: backslash stays
# expected: [a\}b]
case07 a\}b;

# --- quoted ---

# escaped double quotes inside double quotes: string does not end, backslashes removed
# expected: [say "hi"]
case08 "say \"hi\"";

# escaped single quote inside single quotes
# expected: [it's]
case09 'it\'s';

# escaped backslash inside quotes
# expected: [back\slash]
case10 "back\\slash";

# unknown escape inside quotes: backslash stays
# expected: [a\{b]
case11 "a\{b";

# optional: nginx converts \t, \r, \n escapes into the control characters
# expected: [tab<TAB>here]
case12 "tab\there";

# --- escaped newline (line counting) ---

# backslash before a newline: the newline does not end the word,
# backslash AND newline stay in the text, the token keeps its START line
# expected: WORD case13 on line 63, WORD [/var/\<newline>www] on line 63, SEMICOLON on line 64
case13 /var/\
www;

# the line count must not drift after the escaped newline
# expected: WORD case14 on line 68
case14 done;

# a backslash in a comment has no effect, even as the last character of the file (no newline at file end)
# expected: no tokens from the comment below
# comment \