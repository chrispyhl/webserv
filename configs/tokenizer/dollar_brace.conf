# "{" directly after "$" does not end a word (nginx variable syntax ${name})
# source: ngx_conf_read_token, "if (ch == '{' && variable) continue;"

# braced variable: one single word
# expected: WORD return, WORD 200, WORD [${host}a], SEMICOLON
return 200 ${host}a;

# braced variables in the middle of a word (the usual form in redirects)
# expected: WORD return, WORD 301, WORD [https://${host}${request_uri}], SEMICOLON
return 301 https://${host}${request_uri};

# "{" NOT directly after "$" still ends the word
# expected: WORD location, WORD [$a], LBRACE, RBRACE
location $a{}

# a later "{" in the same word still ends it: only the "{" directly after "$" is kept
# expected: WORD location, WORD [x${a}y], LBRACE, RBRACE
location x${a}y{}

# "{" right after a closing "}" of a variable ends the word
# expected: WORD location, WORD [${x}], LBRACE, RBRACE
location ${x}{}

# "{" after a variable without braces ends the word, even when a braced variable came before
# expected: WORD location, WORD [${x}$a], LBRACE, RBRACE
location ${x}$a{}

# an escaped "$" is not a variable start, so the "{" after it ends the word
# expected: WORD location, WORD [\$], LBRACE, RBRACE
location \${}

# several "{" directly after "$" all stay in the word (keeping a "{" does not reset nginx's "variable" flag)
# expected: WORD return, WORD 200, WORD [${{x], SEMICOLON
return 200 ${{x;
