# valid nginx syntax that appears in real configs and is easy to tokenize wrong

# comments glued directly to ";", "{" and "}"
server{#comment after an opening brace
    listen 8080;#comment after a semicolon
}#comment after a closing brace

# a whole block on one line, nested braces glued together
server{location /{root ./www;index index.html;}}

# a typical redirect with variables
return 301 https://$host$request_uri;

# a quoted path with a space, followed by more arguments
error_page 404 "/my errors/404.html" =200;

# non-ASCII (UTF-8) characters in a word and in a quoted string
server_name münchen.example;
return 200 "Grüße aus Heilbronn";

# one directive spread over several lines, with a comment on each line
allow_methods GET     # read
              POST    # create
              DELETE; # remove
